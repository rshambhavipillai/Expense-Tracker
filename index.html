<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple expense tracker for keeping spending organized." />
    <title>Spendly - Expense Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Personal finance</p>
          <h1>Spendly</h1>
          <p class="subtitle">A clear view of where your money goes.</p>
        </div>
        <div class="header-mark" aria-hidden="true">+</div>
      </header>

      <section class="summary-card" aria-labelledby="summary-title">
        <div>
          <p class="summary-label" id="summary-title">Total spending</p>
          <p class="total-amount" id="total-amount">€0.00</p>
        </div>
        <p class="summary-count" id="expense-count">0 expenses</p>
      </section>

      <div class="content-grid">
        <section class="panel form-panel" aria-labelledby="form-title">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Track a purchase</p>
              <h2 id="form-title">Add expense</h2>
            </div>
          </div>

          <form id="expense-form">
            <div class="field-group">
              <label for="description">Description</label>
              <input
                id="description"
                name="description"
                type="text"
                placeholder="e.g. Morning coffee"
                maxlength="80"
                required
              />
            </div>

            <div class="field-row">
              <div class="field-group">
                <label for="amount">Amount</label>
                <div class="input-with-prefix">
                  <span aria-hidden="true">€</span>
                  <input
                    id="amount"
                    name="amount"
                    type="number"
                    min="0.01"
                    step="0.01"
                    placeholder="0.00"
                    required
                  />
                </div>
              </div>

              <div class="field-group">
                <label for="date">Date</label>
                <input id="date" name="date" type="date" required />
              </div>
            </div>

            <div class="field-group">
              <label for="category">Category</label>
              <select id="category" name="category" required>
                <option value="" disabled selected>Choose a category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Health">Health</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <button class="primary-button" type="submit">Add expense <span aria-hidden="true">+</span></button>
            <p class="form-feedback" id="form-feedback" role="status" aria-live="polite"></p>
          </form>
        </section>

        <section class="panel list-panel" aria-labelledby="list-title">
          <div class="panel-heading list-heading">
            <div>
              <p class="eyebrow">Your activity</p>
              <h2 id="list-title">Recent expenses</h2>
            </div>
            <button class="text-button" id="clear-all" type="button" hidden>Clear all</button>
          </div>

          <div class="expense-list" id="expense-list"></div>
          <div class="empty-state" id="empty-state">
            <div class="empty-icon" aria-hidden="true">◎</div>
            <h3>No expenses yet</h3>
            <p>Add your first expense to start seeing your spending here.</p>
          </div>
        </section>
      </div>
    </main>

    <template id="expense-template">
      <article class="expense-item">
        <div class="category-icon" aria-hidden="true"></div>
        <div class="expense-details">
          <h3 class="expense-description"></h3>
          <p class="expense-meta"></p>
        </div>
        <div class="expense-right">
          <p class="expense-amount"></p>
          <button class="delete-button" type="button">Remove</button>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
